name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab: tests the chosen branch, and deploys it only if it is main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Style and Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, redis, memcache
          coverage: none

      - name: Prepare env file
        run: cp .env.ci .env

      - name: Run composer install
        run: composer install -n --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: talentbattles
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - name: Verify MySQL connection
        run: |
          mysql --version
          sudo apt-get install -y mysql-client
          mysql --host 127.0.0.1 --port ${{ job.services.mysql.ports['3306'] }} -utalentbattles -ppassword -e "SHOW DATABASES"

      # audiowaveform has no Ubuntu package. Its Debian 13 build runs on Ubuntu 24.04, and GitHub hosts it, so CI
      # does not depend on Launchpad being up. The checksum pins the exact file.
      - name: Install Server Software
        env:
          AUDIOWAVEFORM_DEB: https://github.com/bbc/audiowaveform/releases/download/1.10.2/audiowaveform_1.10.2-1-13_amd64.deb
          AUDIOWAVEFORM_SHA256: 4208706c6ae5ffb5761dddf8294eaf648c7ba9fb4d6fc6ec9f021d1bb109ea6e
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          curl -fsSL --retry 3 -o /tmp/audiowaveform.deb "$AUDIOWAVEFORM_DEB"
          echo "$AUDIOWAVEFORM_SHA256  /tmp/audiowaveform.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends /tmp/audiowaveform.deb ffmpeg bpm-tools libsox-fmt-all soundstretch id3v2
          audiowaveform --version

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, redis, memcache
          coverage: none

      - name: Prepare env file
        run: cp .env.ci .env

      - name: Run composer install
        run: composer install -n --prefer-dist

      - name: Prepare Laravel Application
        run: php artisan key:generate

      - name: Run tests
        env:
          MYSQL_DATABASE: testing
          DB_USERNAME: talentbattles
          DB_PASSWORD: password
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: php vendor/bin/phpunit

  package:
    name: Package Release
    needs: [quality, tests]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # There is no .env file here: the VITE_ values compiled into the assets come from the repository variables
    env:
      VITE_APP_ENV: production
      VITE_APP_DEBUG: 'false'
      VITE_STRIPE_KEY: ${{ vars.VITE_STRIPE_KEY }}
      VITE_BROADCAST_DRIVER: ${{ vars.VITE_BROADCAST_DRIVER }}
      VITE_REVERB_APP_KEY: ${{ vars.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, redis, memcache
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - name: Build release package
        run: deploy/package.sh release.tar.gz

      # Artifacts of public repositories can be downloaded by anyone: this one must never contain secrets
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to Production
    needs: package
    runs-on: ubuntu-24.04
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: deploy/deploy.sh release.tar.gz "$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
